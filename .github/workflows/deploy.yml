name: Deploy to Google Play

on:
  workflow_dispatch:
    inputs:
      manual_track:
        description: 'Google Play track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Decode Keystore
        if: "${{ secrets.KEYSTORE_BASE64 != '' }}"
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > wearable/release.jks
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > mobile/release.jks

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Determine Google Play Track
        id: determine_track
        run: |
          MOBILE="${{ inputs.manual_track }}"
          WEAR="wear:${{ inputs.manual_track }}"
          echo "mobile_track=$MOBILE" >> $GITHUB_OUTPUT
          echo "wear_track=$WEAR" >> $GITHUB_OUTPUT

      - name: Build & Sign Release AAB and APK
        run: ./gradlew bundleRelease assembleRelease
        env:
          ANDROID_KEYSTORE_FILE: release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Mobile to Google Play
        if: "${{ secrets.PLAY_SERVICE_ACCOUNT_KEY != '' }}"
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_KEY }}
          packageName: com.bastyoliva.wearoszapya
          releaseFiles: mobile/build/outputs/bundle/release/mobile-release.aab
          status: draft
          tracks: ${{ steps.determine_track.outputs.mobile_track }}

      - name: Upload Wearable to Google Play
        if: "${{ secrets.PLAY_SERVICE_ACCOUNT_KEY != '' }}"
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_KEY }}
          packageName: com.bastyoliva.wearoszapya
          releaseFiles: wearable/build/outputs/bundle/release/wearable-release.aab
          status: draft
          tracks: ${{ steps.determine_track.outputs.wear_track }}

